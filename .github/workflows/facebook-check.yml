name: facebook check

# On the 1st of each month: fetch the last two months of ALSA Agadir's and Amalway's Facebook posts
# (through Apify, with the APIFY_TOKEN secret; the overlap catches what a month's read missed) and list
# the ones the council's claims don't cite or set aside yet. New posts open or update an issue; a
# person reads them and adds claims (see the README's data council). Run by hand, it can go further
# back; the posts it read are attached to the run either way.
on:
  schedule:
    - cron: "23 7 1 * *"
  workflow_dispatch:
    inputs:
      posts:
        description: "Posts at most per page and three months"
        default: "30"
      since:
        description: "From this day (YYYY-MM-DD); empty = the last 60 days"
        default: ""
      issue:
        description: "Open or update an issue with the new posts"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The inbox matches posts against the built network's lines and stops (a release asset).
      - name: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p 'require("./data.lock.json").tag')
          file=$(node -p 'require("./data.lock.json").file')
          gh release download "$tag" --pattern "$file" --dir data-pack
          node scripts/pack-data.mjs --unpack

      - name: posts
        id: posts
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          POSTS: ${{ inputs.posts || '30' }}
          SINCE: ${{ inputs.since }}
        run: |
          if [ -z "$APIFY_TOKEN" ]; then echo "No APIFY_TOKEN secret: nothing to check."; exit 0; fi
          node scripts/fetch-facebook.mjs "$POSTS" "$SINCE"
          INBOX_REPORT=new-posts.md node scripts/inbox.mjs
          [ -s new-posts.md ] && echo "found=yes" >> "$GITHUB_OUTPUT" || true

      # The posts as read (text, link, date, picture links; no commenters), to take into the inbox:
      # gh run download <run id> --name facebook-posts --dir data/council/inbox
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: hashFiles('data/council/inbox/facebook-latest.json') != ''
        with:
          name: facebook-posts
          path: data/council/inbox/facebook-latest.json
          retention-days: 30

      - name: issue
        if: steps.posts.outputs.found == 'yes' && (github.event_name == 'schedule' || inputs.issue)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "ALSA or Amalway posted on Facebook since the last claims were added (checked $(date -u +%F)):"; echo; cat new-posts.md; echo; echo "To take them: \`bun run council:fetch && bun run council:inbox\`, read each draft against its post, then \`node scripts/inbox.mjs --approve <draft>\` or \`--ignore <draft> \"why\"\`. A new line or route goes in \`data/council/routes.json\`."; } > body.md
          gh label create alsa-posts --color 1d4ed8 --description "ALSA posted something the data may need" --force
          open=$(gh issue list --label alsa-posts --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file body.md; else gh issue create --title "New operator posts to read" --label alsa-posts --body-file body.md; fi
