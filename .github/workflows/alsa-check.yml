name: alsa check

# Every Monday: fetch ALSA's published lines, stops, fares and timetables and
# compare them with the copy Tobis was built from. A change, or ALSA no longer
# answering (the network is moving to a new operator), opens or updates an issue.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: compare
        id: compare
        run: |
          set +e
          ALSA_OUT="$RUNNER_TEMP/alsa" node scripts/fetch-alsa.mjs > "$RUNNER_TEMP/fetch.log" 2>&1
          if [ $? -ne 0 ]; then
            { echo "ALSA's data couldn't be fetched. If this keeps happening, the endpoints may have moved (new operator or new site)."; echo; echo '```'; tail -5 "$RUNNER_TEMP/fetch.log"; echo '```'; } > report.md
            echo "found=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node scripts/alsa-diff.mjs data/raw/agadir/alsa "$RUNNER_TEMP/alsa" > report.md
          code=$?
          cat report.md
          [ $code -eq 2 ] && echo "found=yes" >> "$GITHUB_OUTPUT"
          [ $code -le 2 ] || exit $code

      - name: issue
        if: steps.compare.outputs.found == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Checked $(date -u +%F) against the copy in \`data/raw/agadir/alsa\` (fetched $(cat data/raw/agadir/alsa/fetched-at.txt | cut -c1-10))."; echo; cat report.md; echo; echo "To take the changes: \`node scripts/fetch-alsa.mjs && node scripts/build-data.mjs agadir\`, then check, pack the data and deploy."; } > body.md
          gh label create alsa-data --color c2410c --description "ALSA's published data changed" --force
          open=$(gh issue list --label alsa-data --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then gh issue comment "$open" --body-file body.md; else gh issue create --title "ALSA's data changed" --label alsa-data --body-file body.md; fi
