name: deploy

# Every push and pull request: checks, build, smoke check in a real Chrome.
# A push to master then deploys tobis.pages.dev; "Run workflow" can deploy the preview instead.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: where to deploy
        type: choice
        options: [preview, live]
        default: preview

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      # The built data and map aren't in git: they're a release asset, named in data.lock.json.
      - name: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(node -p 'require("./data.lock.json").tag')
          file=$(node -p 'require("./data.lock.json").file')
          gh release download "$tag" --pattern "$file" --dir data-pack
          node scripts/pack-data.mjs --unpack

      - run: bun run release

      - name: smoke
        run: |
          python3 scripts/serve-like-pages.py dist 4173 2>/dev/null &
          start_chrome() { google-chrome --headless=new --no-first-run --no-default-browser-check --disable-gpu --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/chrome" about:blank >"$RUNNER_TEMP/chrome.log" 2>&1 & }
          start_chrome
          # Chrome can take a while to come up on a busy runner: wait up to 90 s, start it again if it died,
          # and fail with its log rather than a bare "connection refused".
          for i in $(seq 1 90); do
            curl -sf http://127.0.0.1:9222/json/version >/dev/null && curl -sf http://127.0.0.1:4173/ >/dev/null && break
            if [ "$i" = 30 ] && ! pgrep -f "remote-debugging-port=9222" >/dev/null; then echo "Chrome exited; starting it again"; start_chrome; fi
            sleep 1
          done
          if ! curl -sf http://127.0.0.1:9222/json/version >/dev/null; then echo "Chrome never came up:"; tail -40 "$RUNNER_TEMP/chrome.log"; exit 1; fi
          node scripts/smoke.mjs http://127.0.0.1:4173/

      - name: deploy
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Production only ever comes from master; anything else goes to the preview.
          BRANCH: ${{ github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.target == 'live') && 'master' || 'preview' }}
        run: bunx wrangler@4.139.0 pages deploy dist --project-name tobis --branch "$BRANCH"
